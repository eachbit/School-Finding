server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: School-Finding
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:school_finding_local}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:school_finding_app}
    password: ${DB_PASSWORD:}
    hikari:

      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.project.pojo
  configuration:
    map-underscore-to-camel-case: true

    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-flat-param-object: true

app:
  upload:
    directory: ${UPLOAD_DIRECTORY:.local/uploads}
  token:

    expire-hours: 24
